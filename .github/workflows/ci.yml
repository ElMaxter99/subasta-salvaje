name: CI

on:
  push:
  pull_request:

# Cancela ejecuciones antiguas de la misma rama/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  # Sin credenciales la app arranca en MODO DEMO (PGlite): la CI no usa ningún secreto ni servicio externo.
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, tipos, tests, build y secretos
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan:secrets también revisa el historial de git
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run scan:secrets

  postgres:
    name: Postgres 16 real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/postgres-real.test.ts

  e2e:
    name: E2E (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Chromium propio de Playwright: no se define PW_CHROMIUM_PATH (solo hace falta con un Chromium externo).
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Subir informe y trazas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultados
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
